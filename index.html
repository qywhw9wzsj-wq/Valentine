<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> Wetsch du min Valentinsschatz si? </title>
  <style>
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:grid; place-items:center;
      min-height:100vh; margin:0; padding:20px;
      background: #fff3f8;
      overflow:hidden;
    }
    .card{
      width:min(560px,96vw);
      background:#fff;
      border:1px solid #f1c7da;
      border-radius:18px;
      padding:22px 18px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      position:relative;
      z-index:2;
    }
    h1{margin:0 0 8px; font-size:1.5rem}
    p{margin:0 0 12px; line-height:1.4}
    .arena{
      position:relative;
      height:220px;
      border-radius:14px;
      border:1px dashed #f1c7da;
      background:#fff;
      overflow:hidden;
      margin-top:12px;
    }
    .btn{
      position:absolute;
      padding:12px 18px;
      border-radius:999px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
      font-size:1rem;
      user-select:none;
      touch-action:manipulation;
      transition: transform .12s ease;
      white-space:nowrap;
    }
    #yes{
      left:16px; top:62%;
      border-color:#ff7bb0;
      background:#ffedf5;
      transform-origin:left center;
    }
    #no{
      left:170px; top:62%;
    }
    .result{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#fff3f8;
      border:1px solid #f1c7da;
      display:none;
    }
    .hint{
      margin-top:10px;
      color:#6b6b6b;
      font-size:.95rem;
    }

    .fx-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
    }
    .piece{
      position:absolute;
      top:-24px;
      will-change: transform;
      animation: fall linear forwards;
      opacity:.95;
      text-shadow: 0 6px 18px rgba(0,0,0,.10);
      user-select:none;
    }
    @keyframes fall{
      to{
        transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot));
        opacity: 1;
      }
    }

    .debug{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e8b7cd;
      background:#fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
      line-height:1.35;
      max-height:180px;
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      display:none;
    }
    .debug.show{ display:block; }
  </style>
</head>
<body>
  <div class="fx-layer" id="fx"></div>

  <div class="card">
    <h1>Liebi Selène, wetsch du min Valentinsschatz sii?🤞😘</h1>
    <p>Wähl us:</p>

    <div class="arena" id="arena" aria-label="Antwortbereich">
      <button class="btn" id="yes" type="button">Ja unbedingt❤️</button>
      <button class="btn" id="no" type="button">Neee kei Bock</button>
    </div>

    <div class="hint" id="hint">
      Tipp: Klick ah wie du dich entschiede hesch!
    </div>

    <div class="result" id="result" role="status" aria-live="polite"></div>
    <div class="debug" id="debug"></div>

    <form action="https://formspree.io/f/mzdvrkj" method="POST" id="replyForm">
      <input type="hidden" name="answer" id="answerField" value="">
      <input type="hidden" name="dodges" id="dodgesField" value="">
      <input type="hidden" name="page" value="valentinskarte">
      <input type="hidden" name="_subject" value="💘 Neue Valentins-Antwort">
    </form>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const yesBtn = document.getElementById("yes");
    const noBtn  = document.getElementById("no");
    const result = document.getElementById("result");
    const hint   = document.getElementById("hint");

    const answerField = document.getElementById("answerField");
    const dodgesField = document.getElementById("dodgesField");
    const form = document.getElementById("replyForm");

    const fx = document.getElementById("fx");
    const debugEl = document.getElementById("debug");

    const DEBUG = true;

    function dbg(msg){
      if (!DEBUG) return;
      debugEl.classList.add("show");
      const ts = new Date().toISOString();
      debugEl.textContent += `[${ts}] ${msg}\n`;
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    dbg(`UA: ${navigator.userAgent}`);
    dbg(`Page: ${location.href}`);

    let alreadySent = false;

    async function sendAnswer(value){
      if (alreadySent) { dbg("sendAnswer: alreadySent=true, skip"); return; }
      alreadySent = true;

      answerField.value = value;
      dodgesField.value = String(dodges);

      dbg(`sendAnswer: value="${value}", dodges=${dodges}`);
      dbg(`Form action: ${form.action}`);

      const data = new FormData(form);

      try{
        dbg("fetch: POST -> formspree (Accept: application/json) ...");
        const res = await fetch(form.action, {
          method: "POST",
          body: data,
          headers: { "Accept": "application/json" }
        });

        dbg(`fetch: status=${res.status} ok=${res.ok}`);

        let text = "";
        try{
          const ct = res.headers.get("content-type") || "";
          dbg(`fetch: content-type=${ct}`);
          if (ct.includes("application/json")) {
            const j = await res.json();
            dbg(`fetch: json=${JSON.stringify(j)}`);
          } else {
            text = await res.text();
            dbg(`fetch: text=${text.slice(0, 400)}`);
          }
        } catch (e) {
          dbg(`fetch: parse error: ${String(e)}`);
        }

        if (!res.ok){
          alreadySent = false;
          dbg("fetch: NOT OK -> alreadySent reset to false");
        }
      } catch(e){
        alreadySent = false;
        dbg(`fetch: ERROR: ${String(e)}`);
      }
    }

    const MAX_DODGES = 34;
    let dodges = 0;

    const noTexts = [
      "Nein 🙃","Sicher? 😅","Wirklich? 🥺","Komm schon 😳",
      "Doch","Doch","Doch","Doch","Doch","Doch","Doch","Doch",
      "Doch","Doch","Doch","Doch","Doch","Doch","Doch","Doch",
      "Doch","Doch","Doch","Doch","Doch","Doch","Doch","Doch",
      "Doch","Doch","Doch","Doch","Doch","Doch"
    ];

    function show(msg){
      result.style.display = "block";
      result.textContent = msg;
    }

    function clamp(v, min, max){
      return Math.max(min, Math.min(max, v));
    }

    function confettiHearts(){
      const count = 120;
      const symbols = ["❤️","💘","😍","💕","💗","❤️","🥰","💐","❤️‍🔥","✨","🎉"];
      const w = window.innerWidth;

      for (let i = 0; i < count; i++){
        const el = document.createElement("div");
        el.className = "piece";
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        const left = Math.random() * w;
        const dx = (Math.random() * 2 - 1) * 220;
        const rot = (Math.random() * 2 - 1) * 720;
        const dur = 2.4 + Math.random() * 1.9;
        const size = 14 + Math.random() * 22;
        const delay = Math.random() * 0.25;

        el.style.left = `${left}px`;
        el.style.fontSize = `${size}px`;
        el.style.setProperty("--dx", `${dx}px`);
        el.style.setProperty("--rot", `${rot}deg`);
        el.style.animationDuration = `${dur}s`;
        el.style.animationDelay = `${delay}s`;

        fx.appendChild(el);

        setTimeout(() => el.remove(), (dur + delay) * 1000 + 200);
      }
    }

    yesBtn.addEventListener("click", () => {
      show("Yess! Ich freui mich uf de 14.!❤️");
      confettiHearts();
      sendAnswer("JA, sie chans chum erwarte!");
    });

    noBtn.addEventListener("click", () => {
      show("Ich weiss dass du trotzdem wotsch😘");
      sendAnswer("Sie het sage und schreibe 33x nei druckt😅😘");
    });

    function moveNoAwayFrom(pointerX, pointerY){
      if (dodges >= MAX_DODGES) return;

      dodges++;
      noBtn.textContent = noTexts[Math.min(dodges, noTexts.length - 1)];

      const scale = 1 + dodges * 0.06;
      yesBtn.style.transform = `translateY(-50%) scale(${scale})`;

      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const curLeft = parseFloat(getComputedStyle(noBtn).left) || 0;
      const curTop  = parseFloat(getComputedStyle(noBtn).top)  || 0;

      const btnCx = a.left + curLeft + b.width / 2;
      const btnCy = a.top  + curTop  + b.height / 2;

      let dx = btnCx - pointerX;
      let dy = btnCy - pointerY;

      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
        dx = 1; dy = 1;
      }

      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;

      const step = 110;

      const nextLeft = clamp(curLeft + dx * step, 8, a.width  - b.width  - 8);
      const nextTop  = clamp(curTop  + dy * step, 8, a.height - b.height - 8);

      noBtn.style.left = `${nextLeft}px`;
      noBtn.style.top  = `${nextTop}px`;

      if (dodges === MAX_DODGES) {
        hint.textContent = "🙄😘";
        noBtn.textContent = "Neee 😘";
      }
    }

    arena.addEventListener("pointermove", (e) => {
      if (dodges >= MAX_DODGES) return;

      const b = noBtn.getBoundingClientRect();
      const cx = b.left + b.width / 2;
      const cy = b.top + b.height / 2;

      const dist = Math.hypot(cx - e.clientX, cy - e.clientY);

      const TRIGGER_RADIUS = 85;

      if (dist < TRIGGER_RADIUS) {
        moveNoAwayFrom(e.clientX, e.clientY);
      }
    });

    noBtn.addEventListener("touchstart", (e) => {
      if (dodges < MAX_DODGES) e.preventDefault();
      const t = e.touches[0];
      moveNoAwayFrom(t.clientX, t.clientY);
    }, { passive: false });

    noBtn.style.left = "170px";
    noBtn.style.top = "62%";

    yesBtn.style.top = "62%";
    yesBtn.style.transform = "translateY(-50%) scale(1)";

    noBtn.style.transform = "translateY(-50%)";
  </script>
</body>
</html>
